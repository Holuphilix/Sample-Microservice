name: CI Pipeline

# Trigger CI on pushes and pull requests targeting the main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Build, test, and run a filesystem vulnerability scan
  build-test-scan:
    name: Build, Test, and Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Run Trivy Filesystem Scan
        # Use Trivy action to scan repository filesystem for vulnerabilities
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # Build Docker image, scan it, and push to Docker Hub (runs after build-test-scan)
  docker-build-push:
    name: Docker Build, Image Scan, and Push
    runs-on: ubuntu-latest
    needs: build-test-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            holuphilix/sample-microservice:${{ github.sha }}
            holuphilix/sample-microservice:latest

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: image
          image-ref: holuphilix/sample-microservice:${{ github.sha }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker Image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            holuphilix/sample-microservice:${{ github.sha }}
            holuphilix/sample-microservice:latest

