name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "Lint step placeholder"

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build || echo "No build step defined"

  # Security scan jobs (placeholders): integrate Trivy and Gitleaks in CI pipeline.
